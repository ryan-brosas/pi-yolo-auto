name: model-sync

# Weekly catalog refresh: re-runs scripts/update-models.js against the live API
# and, when the models.json / deprecated / README table changed, commits and
# pushes the result. Requires the YOLO_AUTO_API_KEY secret; without it this
# workflow no-ops with a warning (same gate as the live provider probe).
on:
  schedule:
    - cron: '13 4 * * 1'   # 04:13 UTC Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync model catalog
    runs-on: ubuntu-latest
    env:
      YOLO_AUTO_API_KEY: ${{ secrets.YOLO_AUTO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require API key secret
        run: |
          if [ -z "$YOLO_AUTO_API_KEY" ]; then
            echo '::warning::No YOLO_AUTO_API_KEY secret, skipping scheduled model sync.'
            exit 0
          fi

      - name: Sync models
        if: env.YOLO_AUTO_API_KEY != ''
        run: npm run update-models

      - name: Show diff
        if: env.YOLO_AUTO_API_KEY != ''
        run: git diff --stat || true

      - name: Commit + push catalog changes
        if: env.YOLO_AUTO_API_KEY != ''
        run: |
          if git diff --quiet models.json patch.json custom-models.json deprecated-models.json README.md; then
            echo '::notice::No model catalog changes.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models.json deprecated-models.json README.md
            git commit -m "chore(models): weekly catalog sync [skip ci]"
            git push origin main
            echo '::notice::Model catalog updated and pushed.'
          fi
