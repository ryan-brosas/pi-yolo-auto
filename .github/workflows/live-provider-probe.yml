name: live-provider-probe

# Opt-in live verification against the real Yolo-Auto API. Requires the
# YOLO_AUTO_API_KEY repository secret; without it the live steps skip with a warning.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # 04:23 UTC Monday

permissions:
  contents: read

jobs:
  probe:
    name: Probe live /models + /usage
    runs-on: ubuntu-latest
    env:
      YOLO_AUTO_API_KEY: ${{ secrets.YOLO_AUTO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check API key secret
        id: credentials
        run: |
          if [ -z "$YOLO_AUTO_API_KEY" ]; then
            echo '::warning::No YOLO_AUTO_API_KEY secret; skipping live provider requests.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe live /models + /usage
        if: steps.credentials.outputs.available == 'true'
        run: npm run probe:live

      - name: Dry-run model sync (no write-back)
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/update-models.js --dry-run

      - name: Sanity-check shipped scripts
        run: npm run check
