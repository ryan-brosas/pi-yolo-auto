name: npm-publish

# Publishes pi-yolo-auto to npm on v* tag push.
#
# Auth — pick ONE, the workflow auto-detects:
#
#   Option A: NPM_TOKEN secret (classic)
#     1. npmjs.com -> Access Tokens -> create a token with publish access
#     2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#        New repository secret: NPM_TOKEN
#
#   Option B: npm trusted publisher / OIDC (recommended — no secret stored)
#     1. Register this repo as a trusted publisher on npm, either:
#        - from a machine logged into npm:  npm publish --provenance
#          (first run offers to register the GitHub Actions publisher), or
#        - npmjs.com -> your package -> Access -> Trusted publishers ->
#          add ryan-brosas/pi-yolo-auto (tag pattern v*)
#     2. Nothing else — the runner's OIDC token authenticates the publish.
#
# Tag must match the package.json version (e.g. push v0.1.3 for 0.1.3).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write    # required for Option B (OIDC) and --provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkgver=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      - name: Install + verify
        run: |
          npm ci
          npm run verify

      - name: Detect auth mode
        id: auth
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (NPM_TOKEN secret)
        if: steps.auth.outputs.mode == 'token'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (OIDC trusted publisher)
        if: steps.auth.outputs.mode == 'oidc'
        run: |
          set -o pipefail
          # Exact protocol from npm 10.9.8 lib/utils/oidc.js
          CODE=$(curl -s -o /tmp/idt.json -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=npm:registry.npmjs.org")
          echo "ID-token GET: HTTP $CODE"
          GJWT=$(node -pe 'try{JSON.parse(require("fs").readFileSync("/tmp/idt.json","utf8")).value||""}catch(e){""}' 2>/dev/null || true)
          AUD=$(GJWT="$GJWT" node -pe 'try{const j=process.env.JWT||"";const s=j.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");JSON.parse(Buffer.from(s,"base64").toString()).aud}catch(e){"decode-failed"}' 2>/dev/null || true)
          echo "GitHub JWT length: ${#GJWT}, aud: $AUD"
          if [ -z "$GJWT" ]; then echo "no ID token obtained"; exit 1; fi
          EXCODE=$(curl -s -o /tmp/exch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GJWT" \
            -H "Content-Type: application/json" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/pi-yolo-auto)
          echo "token exchange: HTTP $EXCODE"
          echo "exchange body: $(cat /tmp/exch.json)"
          NTOK=$(node -pe 'try{JSON.parse(require("fs").readFileSync("/tmp/exch.json","utf8")).token||""}catch(e){""}' 2>/dev/null || true)
          if [ -z "$NTOK" ]; then
            echo "::error::Token exchange failed — the registry rejected the GitHub JWT for this package. Body above is the authoritative answer."
            exit 1
          fi
          echo "--- exchange OK, publishing with the exchanged npm token:"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NTOK" > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance
