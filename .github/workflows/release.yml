name: release

# On v* tag push: verify the tag matches package.json, run the full check
# suite, and create a DETAILED GitHub Release (categorized commits with full
# messages + per-file diffstat, generated by scripts/release-notes.mjs).
#
# npm publishing lives in .github/workflows/npm-publish.yml (same tag trigger).
#
# Tag must match the package.json version (e.g. push v0.1.3 for 0.1.3).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # for creating the GitHub Release

jobs:
  release:
    name: Verify + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkgver=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi

      - name: Install + verify
        run: |
          npm ci
          npm run verify

      - name: Generate release notes
        id: notes
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}~1" 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then
            BODY="$(node scripts/release-notes.mjs "$PREV" "${GITHUB_REF_NAME}")"
          else
            BODY="$(node scripts/release-notes.mjs "" "${GITHUB_REF_NAME}")"
          fi
          echo "BODY<<EOF" >> "$GITHUB_ENV"
          printf '%s\n' "$BODY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ env.BODY }}
          generate_release_notes: false
